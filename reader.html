<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>livecap reader</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161a21; --line: #252b36;
    --fg: #edf1f7; --dim: #8b95a7; --accent: #7dd3fc; --pin: #fbbf24;
    --size: 30px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column;
    font-family: "Inter", "Segoe UI", "Yu Gothic UI", "Meiryo",
                 "Noto Sans CJK JP", "Noto Sans", system-ui, sans-serif;
  }

  header {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel);
    border-bottom: 1px solid var(--line); font-size: 13px;
  }
  header .grow { flex: 1; }
  button {
    font: inherit; font-size: 13px; color: var(--fg); cursor: pointer;
    background: #1f2531; border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 11px;
  }
  button:hover { background: #29313f; }
  button.on { background: var(--accent); border-color: var(--accent); color: #06202c; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.up { background: #4ade80; box-shadow: 0 0 7px #4ade80; }
  .dot.down { background: #ef4444; box-shadow: 0 0 7px #ef4444; }
  .lang { color: var(--dim); }

  /* The mining surface. Everything here must stay real, selectable DOM text
     so Yomitan can scan it and lift the surrounding sentence. */
  #log {
    flex: 1; overflow-y: auto; padding: 24px 28px 40vh;
    display: flex; flex-direction: column; gap: 14px;
  }
  .line {
    font-size: var(--size); line-height: 1.75;
    max-width: 34em; padding: 6px 10px; border-radius: 6px;
    border-left: 3px solid transparent;
    user-select: text; -webkit-user-select: text;
    cursor: text; scroll-margin-bottom: 40vh;
  }
  .line:hover { background: #151a22; border-left-color: var(--line); }
  .line.partial { color: var(--dim); border-left-color: var(--pin); }
  .line.pinned { background: #1a1f29; border-left-color: var(--pin); }
  /* Rendered from a data attribute so the timestamp is not DOM text -
     otherwise Yomitan can absorb it into the sentence it mines. */
  .line::before {
    content: attr(data-time);
    display: block; font-size: 12px; color: var(--dim);
    margin-bottom: 2px; user-select: none; font-variant-numeric: tabular-nums;
  }
  .line .tr {
    display: block; font-size: calc(var(--size) * .52);
    color: var(--accent); margin-top: 4px; line-height: 1.5;
  }
  .empty { color: var(--dim); font-size: 15px; padding: 8px 10px; }

  #jump {
    position: fixed; right: 26px; bottom: 26px; display: none;
    background: var(--accent); color: #06202c; border-color: var(--accent);
    font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,.5);
  }
  #jump.show { display: block; }
</style>
</head>
<body>

<header>
  <span id="conn"><span class="dot down"></span></span>
  <span class="lang" id="lang">—</span>
  <span class="grow"></span>
  <button id="smaller" title="Smaller text">A−</button>
  <button id="bigger" title="Larger text">A+</button>
  <button id="follow" class="on" title="Auto-scroll to newest">Follow</button>
  <button id="copy" title="Copy the whole transcript">Copy all</button>
  <button id="clear">Clear</button>
</header>

<div id="log"><div class="empty">Waiting for speech… hover any word with Yomitan to mine it.</div></div>
<button id="jump">↓ New captions</button>

<script>
(function () {
  const q = new URLSearchParams(location.search);
  const WS_PORT = parseInt(q.get("ws") || "8765", 10);

  const log = document.getElementById("log");
  const jump = document.getElementById("jump");
  let follow = true;
  let partialEl = null;
  let size = parseInt(localStorage.getItem("livecap.size") || q.get("size") || "30", 10);

  function applySize() {
    document.documentElement.style.setProperty("--size", size + "px");
    try { localStorage.setItem("livecap.size", String(size)); } catch (e) {}
  }
  applySize();

  function atBottom() {
    return log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  }

  function scrollDown() {
    log.scrollTop = log.scrollHeight;
    jump.classList.remove("show");
  }

  log.addEventListener("scroll", () => {
    if (!follow) return;
    if (!atBottom()) jump.classList.add("show");
    else jump.classList.remove("show");
  });

  function stamp(ts) {
    const d = ts ? new Date(ts * 1000) : new Date();
    return d.toTimeString().slice(0, 8);
  }

  function clearEmpty() {
    const e = log.querySelector(".empty");
    if (e) e.remove();
  }

  function makeLine(m, isPartial) {
    const div = document.createElement("div");
    div.className = "line" + (isPartial ? " partial" : "");

    div.dataset.time = stamp(m.ts) + (isPartial ? " · …" : "");

    // Sentence text as a bare text node: Yomitan reads this directly.
    div.appendChild(document.createTextNode(m.text));

    if (m.tr) {
      const tr = document.createElement("span");
      tr.className = "tr";
      tr.textContent = m.tr;
      div.appendChild(tr);
    }

    div.addEventListener("dblclick", () => {
      div.classList.toggle("pinned");
    });
    return div;
  }

  function onFinal(m) {
    clearEmpty();
    if (partialEl) { partialEl.remove(); partialEl = null; }
    const wasBottom = atBottom();
    log.appendChild(makeLine(m, false));
    while (log.children.length > 500) log.removeChild(log.firstChild);
    if (follow && wasBottom) scrollDown();
    else if (follow) jump.classList.add("show");
  }

  function onPartial(m) {
    clearEmpty();
    const wasBottom = atBottom();
    if (partialEl) partialEl.remove();
    partialEl = makeLine(m, true);
    log.appendChild(partialEl);
    if (follow && wasBottom) scrollDown();
  }

  document.getElementById("bigger").onclick = () => { size = Math.min(72, size + 3); applySize(); };
  document.getElementById("smaller").onclick = () => { size = Math.max(14, size - 3); applySize(); };
  document.getElementById("follow").onclick = (e) => {
    follow = !follow;
    e.target.className = follow ? "on" : "";
    if (follow) scrollDown();
  };
  document.getElementById("clear").onclick = () => {
    log.innerHTML = '<div class="empty">Cleared.</div>';
    partialEl = null;
  };
  document.getElementById("copy").onclick = async () => {
    const text = [...log.querySelectorAll(".line")]
      .filter((n) => !n.classList.contains("partial"))
      .map((n) => [...n.childNodes].filter((c) => c.nodeType === 3)
                    .map((c) => c.textContent).join(""))
      .join("\n");
    try {
      await navigator.clipboard.writeText(text);
      const b = document.getElementById("copy");
      b.textContent = "Copied";
      setTimeout(() => (b.textContent = "Copy all"), 1200);
    } catch (e) {}
  };
  jump.onclick = scrollDown;

  function connect() {
    const ws = new WebSocket("ws://127.0.0.1:" + WS_PORT);
    const conn = document.getElementById("conn");

    ws.onopen = () => {
      conn.innerHTML = '<span class="dot up"></span>';
      ws.send(JSON.stringify({ cmd: "status" }));
    };
    ws.onclose = () => {
      conn.innerHTML = '<span class="dot down"></span>';
      setTimeout(connect, 1500);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (ev) => {
      let m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.type === "final") onFinal(m);
      else if (m.type === "partial") onPartial(m);
      else if (m.type === "status") {
        document.getElementById("lang").textContent = m.lang + " · " + m.model;
      } else if (m.type === "clear") {
        if (partialEl) { partialEl.remove(); partialEl = null; }
      }
    };
  }

  connect();
})();
</script>
</body>
</html>
